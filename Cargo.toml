[package]
name = "ciel-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Async Rust SDK for the CIEL service protocol"
license = "Apache-2.0"
authors = ["SpongeCouna"]
readme = "README.md"
repository = "https://github.com/SpCoGov/ciel-sdk-rust"
keywords = ["ciel", "sdk", "websocket"]
categories = ["api-bindings", "asynchronous"]
include = ["assets/**", "docs/**", "src/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock", "README*", "LICENSE"]

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
x509-parser = "0.18"

[dev-dependencies]
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls-pemfile = "2"
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
